[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "landfinder"
version = "0.1.0"
description = "Local territorial intelligence engine for preliminary land search in Chile."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "pillow>=10.4",
  "openpyxl>=3.1",
  "tenacity>=8.5",
  "pyproj>=3.6",
  "shapely>=2.0",
]

[project.optional-dependencies]
geo = [
  "duckdb>=1.0",
  "geopandas>=1.0",
  "rasterio>=1.3",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/landfinder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
